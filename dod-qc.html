<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borang QC · DOD Worldwide</title>
<style>
  :root {
    --bg:#f5f6fa; --bg2:#ffffff; --bg3:#f0f2f5; --bg4:#e8eaed;
    --line:#e0e3e8; --text:#1a1d23; --textd:#3a3f4b; --textm:#7a8194;
    --blue:#2563eb; --bluebg:#eff6ff; --blueb:#bfdbfe;
    --green:#16a34a; --greenbg:#f0fdf4; --greenb:#bbf7d0;
    --orange:#ea6c00; --orangebg:#fff7ed; --orangeb:#fed7aa;
    --red:#dc2626; --redbg:#fef2f2; --redb:#fecaca;
    --amber:#d97706; --amberbg:#fffbeb;
    --radius:10px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;}
  .app-header{background:var(--bg2);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;}
  .app-header h1{font-size:15px;font-weight:800;}
  .app-header .sub{font-size:10px;color:var(--textm);}
  .container{max-width:720px;margin:0 auto;padding:16px 14px 120px;}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
  .card-header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .card-header-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--textm);font-family:'Courier New',monospace;}
  .card-body{padding:14px;}
  label{font-size:11px;color:var(--textm);font-weight:600;}
  textarea,input[type=number]{background:var(--bg3);border:1px solid var(--line);border-radius:7px;color:var(--text);font-size:14px;padding:9px 11px;outline:none;width:100%;font-family:inherit;}
  textarea:focus,input:focus{border-color:var(--blue);}
  textarea{resize:vertical;min-height:64px;}

  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;}
  .info-item .k{font-size:10px;color:var(--textm);font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
  .info-item .v{font-size:13px;font-weight:600;margin-top:1px;word-break:break-word;}

  /* Check item rows */
  .chk-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bg3);}
  .chk-row:last-child{border-bottom:none;}
  .chk-info{flex:1;min-width:0;}
  .chk-title{font-size:13px;font-weight:700;}
  .chk-sub{font-size:11px;color:var(--textm);margin-top:1px;}
  .chk-btns{display:flex;gap:6px;flex-shrink:0;}
  .chk-btn{width:44px;height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg3);font-size:16px;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center;color:var(--textm);}
  .chk-btn.pass.on{background:var(--green);border-color:var(--green);color:#fff;}
  .chk-btn.fail.on{background:var(--red);border-color:var(--red);color:#fff;}

  .sec-label{font-family:'Courier New',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--textm);font-weight:700;margin:12px 0 4px;}
  .sec-label:first-child{margin-top:0;}

  .qty-wrap{display:flex;align-items:center;gap:10px;}
  .qty-wrap input{width:90px;text-align:center;font-size:16px;font-weight:800;}
  .qty-badge{font-size:11px;font-weight:800;padding:5px 10px;border-radius:6px;}
  .qty-badge.ok{background:var(--greenbg);color:var(--green);border:1px solid var(--greenb);}
  .qty-badge.bad{background:var(--redbg);color:var(--red);border:1px solid var(--redb);}

  .progress-pill{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;font-size:11px;font-weight:700;padding:6px 14px;border-radius:999px;z-index:90;box-shadow:0 4px 14px rgba(0,0,0,.25);}

  .result-banner{border-radius:var(--radius);padding:12px 14px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .result-banner.pass{background:var(--greenbg);border:1.5px solid var(--green);color:var(--green);}
  .result-banner.fail{background:var(--redbg);border:1.5px solid var(--red);color:var(--red);}
  .result-banner.pending{background:var(--bg3);border:1.5px solid var(--line);color:var(--textm);}

  .aku-box{background:var(--amberbg);border:1.5px solid var(--amber);border-radius:var(--radius);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;}
  .aku-box input[type=checkbox]{width:20px;height:20px;margin-top:2px;flex-shrink:0;accent-color:var(--amber);}
  .aku-text{font-size:12px;line-height:1.55;color:#7a4a06;font-weight:600;}

  .btn{padding:13px 20px;border-radius:9px;font-size:14px;font-weight:800;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;}
  .btn-sahkan{background:var(--green);color:#fff;}
  .btn-sahkan:disabled{background:var(--bg4);color:var(--textm);cursor:not-allowed;}
  .btn-ghost{background:var(--bg2);color:var(--textd);border:1px solid var(--line);width:auto;padding:9px 14px;font-size:12px;font-weight:700;}

  .actionbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));z-index:95;}
  .actionbar-inner{max-width:720px;margin:0 auto;}

  /* Photos */
  .photo-grid{display:flex;gap:8px;flex-wrap:wrap;}
  .photo-thumb{width:74px;height:74px;border-radius:8px;object-fit:cover;border:1px solid var(--line);position:relative;}
  .photo-cell{position:relative;}
  .photo-del{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;border:2px solid #fff;font-size:11px;font-weight:800;cursor:pointer;line-height:1;}
  .photo-add{width:74px;height:74px;border-radius:8px;border:2px dashed var(--line);background:var(--bg3);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--textm);font-size:10px;font-weight:700;gap:2px;}
  .photo-add span{font-size:20px;}

  /* History */
  .hist-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bg3);font-size:12px;}
  .hist-item:last-child{border-bottom:none;}
  .hist-badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:5px;flex-shrink:0;}
  .hist-badge.PASS{background:var(--greenbg);color:var(--green);}
  .hist-badge.FAIL{background:var(--redbg);color:var(--red);}
  .hist-badge.SKIPPED{background:var(--amberbg);color:var(--amber);}

  .js-section-title{background:var(--bg3);padding:8px 14px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--textd);border-bottom:1px solid var(--line);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;background:#1a1d23;color:#fff;padding:12px 18px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90vw;}
  .toast.error{background:var(--red);}

  .center-msg{text-align:center;padding:60px 20px;color:var(--textm);}
  .center-msg .big{font-size:40px;margin-bottom:10px;}
  .center-msg .t{font-size:15px;font-weight:700;color:var(--textd);margin-bottom:6px;}
  .center-msg .s{font-size:12px;line-height:1.6;}

  /* ── LAPORAN QC (skrin + cetak) ───────── */
  .qc-report{background:#fff;color:#000;font-size:12px;padding:18px;border-radius:10px;border:1px solid var(--line);}
  .qc-report h2{font-size:16px;margin-bottom:2px;}
  .qc-report table{width:100%;border-collapse:collapse;margin-bottom:12px;}
  .qc-report th,.qc-report td{border:1px solid #999;padding:5px 8px;font-size:11px;text-align:left;}
  .qc-report th{background:#eee;text-transform:uppercase;font-size:9px;letter-spacing:.06em;}
  .qc-report .p-sub{font-size:10px;color:#555;margin-bottom:14px;}
  .qc-report .p-sec{font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:14px 0 6px;border-bottom:2px solid #000;padding-bottom:3px;}
  .qc-report .p-aku{border:1.5px solid #000;padding:10px;margin-top:16px;font-size:11px;line-height:1.6;}
  .qc-report .p-sign{margin-top:34px;display:flex;gap:40px;}
  .qc-report .p-sign > div{flex:1;border-top:1px solid #000;padding-top:5px;font-size:10px;text-align:center;}
  .qr-pass{color:#0F7A48;font-weight:800;}
  .qr-fail{color:#dc2626;font-weight:800;}
  .qr-result{border-radius:8px;padding:10px 14px;font-weight:800;font-size:15px;margin-bottom:12px;display:inline-block;border:2px solid;}
  .qr-result-pass{color:#0F7A48;border-color:#0F7A48;background:#f0fdf4;}
  .qr-result-fail{color:#dc2626;border-color:#dc2626;background:#fef2f2;}

  /* ── PRINT ─────────────────────────────── */
  #printSheet{display:none;}
  @media print{
    body{background:#fff;}
    .app-header,.container,.actionbar,.progress-pill,.toast{display:none !important;}
    #printSheet{display:block;padding:0;font-size:12px;color:#000;}
    #printSheet .qc-report{border:none;padding:0;border-radius:0;}
    #printSheet h2{font-size:16px;margin-bottom:2px;}
    #printSheet .p-sub{font-size:10px;color:#555;margin-bottom:14px;}
    #printSheet table{width:100%;border-collapse:collapse;margin-bottom:12px;}
    #printSheet th,#printSheet td{border:1px solid #999;padding:5px 8px;font-size:11px;text-align:left;}
    #printSheet th{background:#eee;text-transform:uppercase;font-size:9px;letter-spacing:.06em;}
    #printSheet .p-box{display:inline-block;width:12px;height:12px;border:1.5px solid #000;vertical-align:middle;margin-right:4px;}
    #printSheet .p-sec{font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:14px 0 6px;border-bottom:2px solid #000;padding-bottom:3px;}
    #printSheet .p-aku{border:1.5px solid #000;padding:10px;margin-top:16px;font-size:11px;line-height:1.6;}
    #printSheet .p-sign{margin-top:34px;display:flex;gap:40px;}
    #printSheet .p-sign > div{flex:1;border-top:1px solid #000;padding-top:5px;font-size:10px;text-align:center;}
  }
</style>
</head>
<body>

<div class="app-header">
  <span style="font-size:20px;">🔍</span>
  <div style="flex:1;">
    <h1>Borang QC Wajib</h1>
    <div class="sub">DOD Worldwide · Quality Control sebelum penghantaran</div>
  </div>
</div>

<div class="container" id="app">
  <div class="center-msg"><div class="big">⏳</div><div class="t">Memuatkan...</div></div>
</div>

<div class="progress-pill" id="progressPill" style="display:none;"></div>

<div class="actionbar" id="actionbar" style="display:none;">
  <div class="actionbar-inner" style="display:flex;gap:8px;">
    <button class="btn btn-sahkan" id="btnSahkan" disabled onclick="submitQC('PASS')">✅ SAHKAN QC LULUS</button>
    <button class="btn" id="btnKilang" disabled style="display:none;background:var(--red);color:#fff;" onclick="submitQC('FAIL')">🚨 HANTAR KE KILANG</button>
  </div>
</div>

<div id="printSheet"></div>

<script>
// ══════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════
const SUPA_URL = 'https://nsvhdilgrurpbjlsyviv.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zdmhkaWxncnVycGJqbHN5dml2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1Nzk4NjYsImV4cCI6MjA5MjE1NTg2Nn0.XKT6hZd2RGB7c-61aq5QDoZaYfIOgfkyTJ0bsiuqPOo';

async function supaFetch(path, opts = {}) {
  const res = await fetch(SUPA_URL + path, {
    method: opts.method || 'GET',
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + SUPA_KEY,
      'Content-Type': 'application/json',
      ...(opts.prefer ? { 'Prefer': opts.prefer } : {}),
    },
    body: opts.body || undefined,
  });
  if (!res.ok) {
    const txt = await res.text();
    const err = new Error('Supabase ' + res.status + ': ' + txt.slice(0, 300));
    err.status = res.status;
    err.body = txt;
    throw err;
  }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

const QC_TABLE_SQL =
`CREATE TABLE IF NOT EXISTS qc_checks (
  id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
  order_id text NOT NULL,
  jobsheet_doc_id uuid,
  checked_by text,
  result text NOT NULL,
  items jsonb,
  qty_expected int,
  qty_counted int,
  remarks text,
  photos jsonb,
  signed_at timestamptz DEFAULT now(),
  created_at timestamptz DEFAULT now()
);
ALTER TABLE qc_checks ENABLE ROW LEVEL SECURITY;
CREATE POLICY "Allow all" ON qc_checks FOR ALL USING (true) WITH CHECK (true);`;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let _toast = null;
function showToast(msg, isErr) {
  if (_toast) { clearTimeout(_toast._t); _toast.remove(); }
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' error' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  _toast = el;
  el._t = setTimeout(() => { el.remove(); _toast = null; }, 3200);
}

function fmtDT(iso) {
  try {
    return new Date(iso).toLocaleString('ms-MY', { timeZone:'Asia/Kuala_Lumpur', day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  } catch { return iso; }
}

// ══════════════════════════════════════════
// SESSION & STATE
// ══════════════════════════════════════════
let session = null;
try { session = JSON.parse(localStorage.getItem('dod_session') || 'null'); } catch(e) {}

const orderId = new URLSearchParams(location.search).get('order_id');

let order = null;          // rekod order dari masterlist
let jsDoc = null;          // dokumen jobsheet terkini (snapshot)
let qcHistory = [];        // rekod qc_checks lepas
let qcState = null;        // state semakan semasa
let photos = [];           // base64 jpeg
const SIZE_ORDER = ['XS','S','M','L','XL','2XL','3XL','4XL','5XL','6XL','7XL','8XL','9XL','10XL','11XL','12XL','13XL','14XL','15XL','22','24','26','28','30','32','34','36','38'];

function jsTotalPcs(js) {
  if (js.adaNama) return (js.namaRows||[]).reduce((s,r)=>s+(parseInt(r.qty)||1),0);
  return Object.values(js.sizeQtys||{}).reduce((s,v)=>s+(parseInt(v)||0),0);
}

function jsSizeRows(js) {
  const q = js.sizeQtys || {};
  const keys = Object.keys(q).filter(k => (parseInt(q[k])||0) > 0);
  keys.sort((a,b) => {
    const ia = SIZE_ORDER.indexOf(a), ib = SIZE_ORDER.indexOf(b);
    return (ia<0?999:ia) - (ib<0?999:ib);
  });
  return keys.map(k => ({ saiz:k, qty:parseInt(q[k])||0 }));
}

// Auto-kira total dari semakan saiz: lulus = qty jobsheet, gagal = jumlah diterima
function sizeCalc(ji) {
  const js = jsDoc.snapshot.jobsheets[ji];
  if (js.adaNama) return null;
  const st = qcState.jobsheets[ji];
  const rows = jsSizeRows(js);
  let counted = 0, resolved = rows.length > 0;
  rows.forEach((r, i) => {
    const s = st.sizes[i];
    if (s === 'pass') counted += r.qty;
    else if (s === 'fail') {
      const rv = st.sizesRecv[i];
      if (rv === '' || rv === null || rv === undefined) resolved = false;
      else counted += (parseInt(rv) || 0);
    } else resolved = false;
  });
  const expected = jsTotalPcs(js);
  return { expected, counted, resolved, status: resolved ? (counted === expected ? 'pass' : 'fail') : null };
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
async function init() {
  const app = document.getElementById('app');

  // Mode VIEW: buka laporan QC tersimpan (dari Dokumen Tersimpan / supplier portal)
  if (new URLSearchParams(location.search).get('view')) return initViewMode();

  if (!session || !session.name) {
    app.innerHTML = `<div class="center-msg"><div class="big">🔒</div><div class="t">Sila log masuk dahulu</div>
      <div class="s">Borang QC memerlukan sesi login untuk merekod siapa yang membuat pengesahan.</div>
      <div style="margin-top:14px;"><a href="dod-login.html" style="color:var(--blue);font-weight:700;">→ Pergi ke Login</a></div></div>`;
    return;
  }
  if (!orderId) {
    app.innerHTML = `<div class="center-msg"><div class="big">❓</div><div class="t">Tiada order dipilih</div>
      <div class="s">Buka borang QC melalui butang QC dalam side panel customer di Masterlist.</div></div>`;
    return;
  }

  try {
    const [orders, docs, qcs] = await Promise.all([
      supaFetch(`/rest/v1/orders?id=eq.${encodeURIComponent(orderId)}&select=*&limit=1`),
      supaFetch(`/rest/v1/documents?order_id=eq.${encodeURIComponent(orderId)}&doc_type=like.jobsheet%25&is_deleted=not.is.true&order=generated_at.desc&limit=1&select=*`),
      supaFetch(`/rest/v1/qc_checks?order_id=eq.${encodeURIComponent(orderId)}&order=created_at.desc&select=id,result,checked_by,remarks,qty_expected,qty_counted,signed_at,created_at`)
        .catch(e => { if ((e.body||'').includes('qc_checks')) return null; throw e; }),
    ]);
    order = orders && orders[0];
    jsDoc = docs && docs[0];
    qcHistory = qcs || [];

    if (qcs === null) {
      app.innerHTML = `<div class="center-msg"><div class="big">🛠️</div><div class="t">Table qc_checks belum wujud</div>
        <div class="s">Jalankan SQL ini dalam Supabase → SQL Editor, kemudian refresh halaman ini:</div>
        <pre style="text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:10px;overflow-x:auto;margin-top:12px;">${esc(QC_TABLE_SQL)}</pre></div>`;
      return;
    }
    if (!order) {
      app.innerHTML = `<div class="center-msg"><div class="big">🚫</div><div class="t">Order tidak dijumpai</div></div>`;
      return;
    }
    if (!jsDoc || !jsDoc.snapshot || !Array.isArray(jsDoc.snapshot.jobsheets) || !jsDoc.snapshot.jobsheets.length) {
      app.innerHTML = `<div class="center-msg"><div class="big">📋</div><div class="t">Tiada jobsheet untuk order ini</div>
        <div class="s">Borang QC dijana berpandukan jobsheet. Order ini tiada rekod jobsheet dalam sistem,<br>jadi QC digital tidak tersedia (order lama dikecualikan).</div></div>`;
      return;
    }

    initState();
    render();
  } catch(e) {
    app.innerHTML = `<div class="center-msg"><div class="big">⚠️</div><div class="t">Gagal memuatkan</div><div class="s">${esc(e.message)}</div></div>`;
  }
}

// ── Mode VIEW: laporan QC tersimpan (read-only + cetak) ──
// Supplier tak ada dod_session, jadi mode ini tak perlukan login (sama macam jobsheet ?view=1)
async function initViewMode() {
  const app = document.getElementById('app');
  let ref = null;
  try { ref = JSON.parse(sessionStorage.getItem('dod_qc_view') || 'null'); } catch(e) {}
  if (!ref || !ref.qc_check_id) {
    app.innerHTML = `<div class="center-msg"><div class="big">❓</div><div class="t">Tiada rekod QC dipilih</div>
      <div class="s">Buka laporan QC melalui DOKUMEN TERSIMPAN di Masterlist atau butang Fail QC di Supplier Portal.</div></div>`;
    return;
  }
  try {
    const rows = await supaFetch(`/rest/v1/qc_checks?id=eq.${encodeURIComponent(ref.qc_check_id)}&select=*`);
    const q = rows && rows[0];
    if (!q) { app.innerHTML = `<div class="center-msg"><div class="big">🚫</div><div class="t">Rekod QC tidak dijumpai</div></div>`; return; }

    // Mockup dari jobsheet doc (best-effort — laporan tetap papar tanpa mockup jika gagal)
    let mockups = [];
    if (q.jobsheet_doc_id) {
      try {
        const docs = await supaFetch(`/rest/v1/documents?id=eq.${encodeURIComponent(q.jobsheet_doc_id)}&select=snapshot`);
        const snap = docs && docs[0] && docs[0].snapshot;
        if (snap && Array.isArray(snap.jobsheets)) mockups = snap.jobsheets.map(js => js.mockupDataUrl || null);
      } catch(e) {}
    }

    const data = {
      result: q.result,
      checked_by: q.checked_by,
      signed_at: q.signed_at,
      remarks: q.remarks || '',
      items: q.items || { jobsheets: [] },
      photos: Array.isArray(q.photos) ? q.photos : [],
      qty_expected: q.qty_expected || 0,
      qty_counted: q.qty_counted || 0,
      info: {
        name_job: ref.name_job || '',
        cust_name: ref.cust_name || '',
        pic: ref.pic || '',
        kilang: ref.kilang || '',
        kainType: ref.kainType || '',
      },
      mockups,
    };

    const html = qcReportHtml(data);
    app.innerHTML = `
      <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
        <button class="btn btn-sahkan" style="width:auto;background:var(--blue);" onclick="window.print()">🖨️ Cetak Laporan QC</button>
      </div>
      ${html}`;
    document.getElementById('printSheet').innerHTML = html;
  } catch(e) {
    app.innerHTML = `<div class="center-msg"><div class="big">⚠️</div><div class="t">Gagal memuatkan laporan QC</div><div class="s">${esc(e.message)}</div></div>`;
  }
}

function initState() {
  const snap = jsDoc.snapshot;
  qcState = {
    jobsheets: snap.jobsheets.map(js => ({
      kain: null,        // 'pass' | 'fail' | null
      cutting: null,
      qtyCounted: '',
      qtyStatus: null,

}

// ── HTML helper untuk total saiz & kuantiti auto ──
function sizeTotalHtml(calc) {
  if (!calc) return '';
  if (!calc.resolved) {
    return `<span style="font-size:15px;font-weight:800;color:var(--textm);">${calc.counted} / ${calc.expected} pcs</span>
      <div style="font-size:10px;color:var(--textm);text-align:right;">belum lengkap</div>`;
  }
  const diff = calc.counted - calc.expected;
  if (diff === 0) {
    return `<span style="font-size:15px;font-weight:800;color:var(--green);">${calc.counted} / ${calc.expected} pcs</span>
      <div style="font-size:10px;color:var(--green);font-weight:700;text-align:right;">CUKUP ✓</div>`;
  }
  return `<span style="font-size:15px;font-weight:800;color:var(--red);">${calc.counted} / ${calc.expected} pcs</span>
    <div style="font-size:10px;color:var(--red);font-weight:800;text-align:right;">${diff<0?`KURANG ${-diff} PCS ✗`:`LEBIH ${diff} PCS ✗`}</div>`;
}

function qtyAutoHtml(calc) {
  if (!calc) return '';
  if (!calc.resolved) return `<span style="font-size:16px;font-weight:800;color:var(--textm);">—</span>`;
  const diff = calc.counted - calc.expected;
  return `<span style="font-size:16px;font-weight:800;color:${diff===0?'var(--green)':'var(--red)'};">${calc.counted}</span>
    ${diff===0?'<span class="qty-badge ok">SAMA ✓</span>':`<span class="qty-badge bad">${diff<0?'KURANG '+(-diff):'LEBIH '+diff} ✗</span>`}`;
}

function resultBannerHtml(overall) {
  return overall.done
    ? (overall.result === 'PASS'
        ? `<div class="result-banner pass">✅ Keputusan: SEMUA LULUS — sedia untuk disahkan</div>`
        : `<div class="result-banner fail">🔴 Keputusan: QC GAGAL (${overall.failCount} item) — order akan dihantar balik ke supplier dengan tanda URGENT QC GAGAL</div>`)
    : `<div class="result-banner pending">⏳ ${overall.checked}/${overall.total} item diperiksa — lengkapkan semua untuk sahkan</div>`;
}

// Kemaskini paparan total & kuantiti auto tanpa full render (elak hilang fokus input)
function updateSizeTotals(ji) {
  const calc = sizeCalc(ji);
  if (!calc) return;
  const t = document.getElementById(`js_${ji}_sizeTotal`);
  if (t) t.innerHTML = sizeTotalHtml(calc);
  const q = document.getElementById(`js_${ji}_qtyAuto`);
  if (q) q.innerHTML = qtyAutoHtml(calc);
  refreshProgressUI();
}

// Progress pill + banner keputusan + butang sahkan
function refreshProgressUI() {
  const overall = computeOverall();
  const pill = document.getElementById('progressPill');
  if (pill) pill.textContent = `${overall.checked}/${overall.total} item diperiksa`;
  const banner = document.getElementById('resultBannerWrap');
  if (banner) banner.innerHTML = resultBannerHtml(overall);
  refreshSubmit();
}

// ══════════════════════════════════════════
// STATE HANDLERS
// ══════════════════════════════════════════
function keepTransient() {
  const r = document.getElementById('qcRemarks');
  window._remarksKeep = r ? r.value : (window._remarksKeep||'');
  const a = document.getElementById('akuChk');
  window._akuKeep = a ? a.checked : false;
}

function setChk(ji, field, idx, val) {
  keepTransient();
  const st = qcState.jobsheets[ji];
  if (field === 'kain' || field === 'cutting') {
    st[field] = st[field] === val ? null : val;
  } else {
    st[field][idx] = st[field][idx] === val ? null : val;
    // Saiz keluar dari status gagal → kosongkan jumlah diterima
    if (field === 'sizes' && st.sizes[idx] !== 'fail') st.sizesRecv[idx] = '';
  }
  render();
}

// Kuantiti manual — untuk jobsheet Ada Nama sahaja (jobsheet bersaiz auto-kira)
function setQty(ji, val) {
  const st = qcState.jobsheets[ji];
  st.qtyCounted = val;
  const expected = jsTotalPcs(jsDoc.snapshot.jobsheets[ji]);
  if (val === '' || val === null) { st.qtyStatus = null; }
  else { st.qtyStatus = (parseInt(val)||0) === expected ? 'pass' : 'fail'; }
  // Kemaskini badge sahaja — elak full render supaya fokus input kekal
  const badge = document.getElementById(`js_${ji}_qtyBadge`);
  if (badge) badge.innerHTML = st.qtyStatus==='pass'?'<span class="qty-badge ok">SAMA ✓</span>':st.qtyStatus==='fail'?'<span class="qty-badge bad">TAK SAMA ✗</span>':'';
  refreshProgressUI();
}

// Jumlah diterima untuk saiz yang gagal
function setSizeRecv(ji, idx, val) {
  qcState.jobsheets[ji].sizesRecv[idx] = val;
  updateSizeTotals(ji);
}

function computeOverall() {
  let total = 0, checked = 0, failCount = 0;
  qcState.jobsheets.forEach((st, ji) => {
    const js = jsDoc.snapshot.jobsheets[ji];
    let items;
    if (js.adaNama) {
      items = [st.kain, st.cutting, st.qtyStatus, ...st.nama];
      items.forEach(v => { total++; if (v) checked++; if (v === 'fail') failCount++; });
    } else {
      const calc = sizeCalc(ji);
      // Kain + cutting
      [st.kain, st.cutting].forEach(v => { total++; if (v) checked++; if (v === 'fail') failCount++; });
      // Kuantiti auto: kira siap bila semua saiz selesai
      total++;
      if (calc && calc.resolved) { checked++; if (calc.status === 'fail') failCount++; }
      // Saiz: gagal hanya dikira siap bila jumlah diterima diisi
      st.sizes.forEach((v, i) => {
        total++;
        if (v === 'pass') checked++;
        else if (v === 'fail') {
          const rv = st.sizesRecv[i];
          if (rv !== '' && rv !== null && rv !== undefined) checked++;
          failCount++;
        }
      });
    }
  });
  const done = checked === total && total > 0;
  return { total, checked, done, failCount, result: done ? (failCount > 0 ? 'FAIL' : 'PASS') : null };
}

function refreshSubmit() {
  const overall = computeOverall();
  const aku = document.getElementById('akuChk');
  const btnPass = document.getElementById('btnSahkan');
  const btnFail = document.getElementById('btnKilang');
  if (!btnPass || !btnFail) return;
  const remarks = (document.getElementById('qcRemarks')||{}).value || '';
  const akuOk = aku && aku.checked;
  if (overall.failCount > 0) {
    // Ada item gagal → LULUS disable, keluar butang HANTAR KE KILANG
    btnPass.disabled = true;
    btnFail.style.display = 'inline-flex';
    btnFail.disabled = !(overall.done && akuOk && remarks.trim());
  } else {
    btnFail.style.display = 'none';
    btnPass.disabled = !(overall.done && akuOk);
  }
}
document.addEventListener('input', e => { if (e.target && e.target.id === 'qcRemarks') refreshSubmit(); });

// ══════════════════════════════════════════
// PHOTOS
// ══════════════════════════════════════════
function addPhotos(files) {
  keepTransient();
  const list = Array.from(files || []);
  if (!list.length) return;
  let pending = list.length;
  list.forEach(f => {
    const img = new Image();
    const url = URL.createObjectURL(f);
    img.onload = () => {
      const MAX = 900;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      photos.push(c.toDataURL('image/jpeg', 0.72));
      URL.revokeObjectURL(url);
      if (--pending === 0) render();
    };
    img.onerror = () => { URL.revokeObjectURL(url); if (--pending === 0) render(); };
    img.src = url;
  });
}

function delPhoto(i) { keepTransient(); photos.splice(i, 1); render(); }

function viewPhoto(i) {
  const w = window.open('', '_blank');
  if (w) w.document.write(`<body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;"><img src="${photos[i]}" style="max-width:100%;max-height:100vh;"></body>`);
}

function viewMockup(ji) {
  const js = jsDoc.snapshot.jobsheets[ji];
  if (!js || !js.mockupDataUrl) return;
  const w = window.open('', '_blank');
  if (w) w.document.write(`<body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;"><img src="${js.mockupDataUrl}" style="max-width:100%;max-height:100vh;"></body>`);
}

// ══════════════════════════════════════════
// SUBMIT
// ══════════════════════════════════════════
async function submitQC(kind) {
  const overall = computeOverall();
  if (!overall.done) return;
  // Pastikan butang yang ditekan padan dengan keputusan sebenar
  if (kind === 'PASS' && overall.failCount > 0) return;
  if (kind === 'FAIL' && overall.failCount === 0) return;
  const remarks = ((document.getElementById('qcRemarks')||{}).value || '').trim();
  const result = kind;

  const confirmMsg = result === 'PASS'
    ? `Sahkan QC LULUS?\n\nNama anda (${session.name}) akan direkod sebagai pemeriksa yang bertanggungjawab.\nStatus order akan bertukar ke READY (sedia hantar).`
    : `HANTAR KE KILANG?\n\nQC gagal (${overall.failCount} item) akan direkod & order dihantar balik ke supplier.\nSupplier portal akan papar tanda 🚨 URGENT QC GAGAL berserta catatan${photos.length?' dan foto bukti':''}.`;
  if (!confirm(confirmMsg)) return;

  const btn = result === 'PASS' ? document.getElementById('btnSahkan') : document.getElementById('btnKilang');
  btn.disabled = true; btn.textContent = '⏳ Menyimpan...';

  // Bina JSON item terperinci
  const snap = jsDoc.snapshot;
  const items = {
    jobsheets: snap.jobsheets.map((js, ji) => {
      const st = qcState.jobsheets[ji];
      return {
        label: js.label || ('Jobsheet ' + (ji+1)),
        kain: { expected: snap.kainType || order.kain_type || '', status: st.kain },
        cutting: { productType: js.productType||'', collarType: js.collarType||'', collarColour: js.collarColour||'', sleeveType: js.sleeveType||'', status: st.cutting },
        qty: js.adaNama
          ? { expected: jsTotalPcs(js), counted: parseInt(st.qtyCounted)||0, status: st.qtyStatus }
          : (c => ({ expected: c.expected, counted: c.counted, status: c.status }))(sizeCalc(ji)),
        sizes: js.adaNama ? [] : jsSizeRows(js).map((r,i)=>({ saiz:r.saiz, qty:r.qty, status:st.sizes[i], received: st.sizes[i]==='fail' ? (parseInt(st.sizesRecv[i])||0) : null })),
        nama: js.adaNama ? (js.namaRows||[]).map((r,i)=>({ nama:r.nama||'', nombor:r.nombor||'', saiz:r.saiz||'', qty:parseInt(r.qty)||1, status:st.nama[i] })) : [],
      };
    }),
  };

  const totalExpected = snap.jobsheets.reduce((s,js)=>s+jsTotalPcs(js),0);
  const totalCounted  = snap.jobsheets.reduce((s, js, ji) => {
    if (js.adaNama) return s + (parseInt(qcState.jobsheets[ji].qtyCounted)||0);
    const c = sizeCalc(ji);
    return s + (c ? c.counted : 0);
  }, 0);

  const signedAt = new Date().toISOString();

  try {
    // 1. Simpan rekod QC (return=representation untuk dapat id)
    const inserted = await supaFetch('/rest/v1/qc_checks', {
      method: 'POST',
      prefer: 'return=representation',
      body: JSON.stringify({
        order_id: orderId,
        jobsheet_doc_id: jsDoc.id,
        checked_by: session.name,
        result,
        items,
        qty_expected: totalExpected,
        qty_counted: totalCounted,
        remarks: remarks || null,
        photos: photos.length ? photos : null,
        signed_at: signedAt,
      }),
    });
    const qcId = inserted && inserted[0] ? inserted[0].id : null;

    // 2. Kemaskini status order
    const newStatus = result === 'PASS' ? 'ready' : 'jahit';
    await supaFetch(`/rest/v1/orders?id=eq.${encodeURIComponent(orderId)}`, {
      method: 'PATCH',
      prefer: 'return=minimal',
      body: JSON.stringify({ production_status: newStatus }),
    });

    // 3. Auto-save dokumen QC → muncul dalam DOKUMEN TERSIMPAN (macam jobsheet)
    const docSnapshot = {
      type: 'qc_report',
      qc_check_id: qcId,
      order_id: orderId,
      result,
      checked_by: session.name,
      signed_at: signedAt,
      name_job: order.name_job || '',
      cust_name: order.cust_name || jsDoc.snapshot.custName || '',
      pic: order.pic || '',
      kilang: jsDoc.snapshot.kilang || order.supplier_name || '',
      kainType: jsDoc.snapshot.kainType || order.kain_type || '',
    };
    await supaFetch('/rest/v1/documents', {
      method: 'POST',
      prefer: 'return=minimal',
      body: JSON.stringify({
        order_id: orderId,
        doc_type: 'qc_report',
        generated_by: session.name,
        generated_at: signedAt,
        snapshot: docSnapshot,
        notes: (result === 'PASS' ? 'QC LULUS — ' : 'QC GAGAL — ') + (order.name_job || ''),
        is_deleted: false,
      }),
    }).catch(e => console.warn('QC doc save failed:', e));

    // 4. Sedia laporan bercetak (berisi keputusan) — cetak hanya selepas sahkan
    const reportData = buildReportDataLocal(result, remarks, items, signedAt, totalExpected, totalCounted);
    document.getElementById('printSheet').innerHTML = qcReportHtml(reportData);

    document.getElementById('app').innerHTML = result === 'PASS'
      ? `<div class="center-msg"><div class="big">✅</div><div class="t">QC LULUS — Disahkan</div>
          <div class="s">Direkod atas nama <b>${esc(session.name)}</b> · ${fmtDT(signedAt)}<br>
          Status order kini <b>READY</b> — boleh hantar kepada customer.<br>
          Dokumen QC disimpan dalam DOKUMEN TERSIMPAN.</div>
          <div style="margin-top:18px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
            <button class="btn btn-sahkan" style="width:auto;background:var(--blue);" onclick="window.print()">🖨️ Cetak — lekatkan pada baju sebagai tanda QC</button>
            <button class="btn-ghost btn" style="width:auto;" onclick="location.reload()">Lihat Rekod QC</button>
          </div></div>`
      : `<div class="center-msg"><div class="big">🔴</div><div class="t">QC GAGAL — Dihantar ke Kilang</div>
          <div class="s">Order dihantar balik ke supplier.<br>Supplier portal akan papar 🚨 <b>URGENT QC GAGAL</b> — supplier boleh buka fail QC &amp; cetak untuk semak${photos.length?' ('+photos.length+' foto bukti dilampirkan)':''}.<br>
          Dokumen QC disimpan dalam DOKUMEN TERSIMPAN.<br><br>Selepas barang dibetulkan, buat QC semula dari Masterlist.</div>
          <div style="margin-top:18px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
            <button class="btn btn-sahkan" style="width:auto;background:var(--red);" onclick="window.print()">🖨️ Cetak Laporan QC Gagal</button>
            <button class="btn-ghost btn" style="width:auto;" onclick="location.reload()">Lihat Rekod QC</button>
          </div></div>`;
    document.getElementById('actionbar').style.display = 'none';
    document.getElementById('progressPill').style.display = 'none';
    showToast(result === 'PASS' ? '✅ QC Lulus disimpan' : '🔴 QC Gagal direkod — dihantar ke kilang');
  } catch(e) {
    btn.disabled = false;
    btn.textContent = result === 'PASS' ? '✅ SAHKAN QC LULUS' : '🚨 HANTAR KE KILANG';
    refreshSubmit();
    if ((e.body||'').includes('qc_checks')) {
      alert('Table qc_checks belum wujud dalam Supabase.\n\nJalankan SQL ini dalam Supabase → SQL Editor:\n\n' + QC_TABLE_SQL);
    } else {
      showToast('Gagal simpan: ' + e.message, true);
    }
  }
}

// Bina data laporan dari state semasa (selepas submit)
function buildReportDataLocal(result, remarks, items, signedAt, totalExpected, totalCounted) {
  return {
    result,
    checked_by: session.name,
    signed_at: signedAt,
    remarks,
    items,
    photos: photos.slice(),
    qty_expected: totalExpected,
    qty_counted: totalCounted,
    info: {
      name_job: order.name_job || '',
      cust_name: order.cust_name || jsDoc.snapshot.custName || '',
      pic: order.pic || '',
      kilang: jsDoc.snapshot.kilang || order.supplier_name || '',
      kainType: jsDoc.snapshot.kainType || order.kain_type || '',
    },
    mockups: jsDoc.snapshot.jobsheets.map(js => js.mockupDataUrl || null),
  };
}

// ══════════════════════════════════════════
// LAPORAN QC (berisi keputusan — cetak selepas sahkan sahaja)
// ══════════════════════════════════════════
function stTxt(s) {
  return s === 'pass' ? '<span class="qr-pass">&#10003; LULUS</span>'
       : s === 'fail' ? '<span class="qr-fail">&#10007; GAGAL</span>'
       : '—';
}

function qcReportHtml(d) {
  const isPass = d.result === 'PASS';
  const secs = (d.items && d.items.jobsheets || []).map((jsIt, ji) => {
    const cuttingSpec = [jsIt.cutting.productType, jsIt.cutting.collarType, jsIt.cutting.collarColour, jsIt.cutting.sleeveType].filter(Boolean).join(' · ') || '—';
    let detail = '';
    if (jsIt.nama && jsIt.nama.length) {
      detail = `<div class="p-sec">Nama &amp; Nombor (ikut saiz)</div>
      <table><tr><th>#</th><th>Nama</th><th>No.</th><th>Saiz</th><th>Qty</th><th>Keputusan</th></tr>
      ${jsIt.nama.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.nama)}</td><td>${esc(r.nombor)}</td><td>${esc(r.saiz)}</td><td>${r.qty}</td><td>${stTxt(r.status)}</td></tr>`).join('')}
      </table>`;
    } else if (jsIt.sizes && jsIt.sizes.length) {
      detail = `<div class="p-sec">Saiz</div>
      <table><tr><th>Saiz</th><th>Qty Jobsheet</th><th>Jumlah Diterima</th><th>Keputusan</th></tr>
      ${jsIt.sizes.map(r=>`<tr><td>${esc(r.saiz)}</td><td>${r.qty}</td><td>${r.status==='fail' ? `<b class="qr-fail">${r.received}</b>` : r.qty}</td><td>${stTxt(r.status)}</td></tr>`).join('')}
      <tr><td><b>TOTAL</b></td><td><b>${jsIt.qty.expected}</b></td><td><b class="${jsIt.qty.counted===jsIt.qty.expected?'qr-pass':'qr-fail'}">${jsIt.qty.counted}</b></td><td>${stTxt(jsIt.qty.status)}</td></tr>
      </table>`;
    }
    const mock = d.mockups && d.mockups[ji];
    return `
    <div class="p-sec">${esc(jsIt.label)}</div>
    ${mock ? `<div style="text-align:center;margin:8px 0;"><img src="${mock}" style="max-width:60%;max-height:240px;border:1px solid #999;"><div style="font-size:9px;color:#555;margin-top:2px;">Mockup / Design</div></div>` : ''}
    <table>
      <tr><th style="width:30%;">Item</th><th>Rujukan Jobsheet</th><th style="width:18%;">Keputusan</th></tr>
      <tr><td>1. Material Kain</td><td>${esc(jsIt.kain.expected||'—')}</td><td>${stTxt(jsIt.kain.status)}</td></tr>
      <tr><td>2. Cutting / Potongan</td><td>${esc(cuttingSpec)}</td><td>${stTxt(jsIt.cutting.status)}</td></tr>
      <tr><td>3. Kuantiti Order</td><td>Sepatutnya: <b>${jsIt.qty.expected} pcs</b> &nbsp;·&nbsp; Dikira: <b>${jsIt.qty.counted} pcs</b>${jsIt.qty.counted!==jsIt.qty.expected?` &nbsp;<b class="qr-fail">(${jsIt.qty.counted<jsIt.qty.expected?'KURANG '+(jsIt.qty.expected-jsIt.qty.counted):'LEBIH '+(jsIt.qty.counted-jsIt.qty.expected)})</b>`:''}</td><td>${stTxt(jsIt.qty.status)}</td></tr>
    </table>
    ${detail}`;
  }).join('');

  const photosHtml = (d.photos && d.photos.length)
    ? `<div class="p-sec">Foto Bukti (${d.photos.length})</div>
       <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">
         ${d.photos.map(p=>`<img src="${p}" style="width:31%;max-height:220px;object-fit:cover;border:1px solid #999;">`).join('')}
       </div>`
    : '';

  return `<div class="qc-report">
    <div class="qr-result ${isPass?'qr-result-pass':'qr-result-fail'}">${isPass?'&#9989; QC LULUS':'&#128680; QC GAGAL — HANTAR KE KILANG (URGENT)'}</div>
    <h2>&#128269; LAPORAN QC — DOD WORLDWIDE</h2>
    <div class="p-sub">Quality Control sebelum penghantaran kepada customer</div>
    <table>
      <tr><th>Nama Job</th><td>${esc(d.info.name_job||'—')}</td><th>Customer</th><td>${esc(d.info.cust_name||'—')}</td></tr>
      <tr><th>PIC</th><td>${esc(d.info.pic||'—')}</td><th>Kilang</th><td>${esc(d.info.kilang||'—')}</td></tr>
      <tr><th>Jenis Kain</th><td>${esc(d.info.kainType||'—')}</td><th>Kuantiti</th><td><b>${d.qty_counted}</b> / ${d.qty_expected} pcs</td></tr>
      <tr><th>Pemeriksa</th><td><b>${esc(d.checked_by||'—')}</b></td><th>Tarikh &amp; Masa</th><td>${fmtDT(d.signed_at)}</td></tr>
    </table>
    ${secs}
    ${d.remarks ? `<div class="p-sec">Catatan</div><div style="border:1px solid #999;padding:8px 10px;font-size:11px;margin-bottom:12px;">${esc(d.remarks)}</div>` : ''}
    ${photosHtml}
    <div class="p-aku">
      <b>PENGESAHAN:</b> Saya, <b>${esc(d.checked_by||'—')}</b>, mengesahkan semua item di atas telah diperiksa secara fizikal
      dan keputusan yang direkod adalah benar mengikut jobsheet. Sekiranya customer menerima barang yang salah selepas
      pengesahan ini, saya bertanggungjawab sepenuhnya.
      <br><br>Disahkan secara digital pada ${fmtDT(d.signed_at)}.
    </div>
    <div class="p-sign">
      <div>Tandatangan Pemeriksa</div>
      <div>Tandatangan Penerima${isPass?' (jika berkaitan)':' / Wakil Kilang'}</div>
    </div>
    ${isPass ? '<div style="margin-top:12px;font-size:9px;color:#555;">* Lekatkan cetakan ini pada bungkusan/baju sebagai tanda QC telah lulus.</div>'
             : '<div style="margin-top:12px;font-size:9px;color:#555;">* Cetakan ini untuk semakan kilang — rujuk item bertanda GAGAL dan jumlah diterima.</div>'}
  </div>`;
}

init();
</script>
