<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobsheet Generator · DOD Worldwide</title>
<style>
  :root {
    --bg:#f5f6fa; --bg2:#ffffff; --bg3:#f0f2f5; --bg4:#e8eaed;
    --line:#e0e3e8; --text:#1a1d23; --textd:#3a3f4b; --textm:#7a8194;
    --blue:#2563eb; --bluebg:#eff6ff; --blueb:#bfdbfe;
    --green:#16a34a; --greenbg:#f0fdf4; --greenb:#bbf7d0;
    --orange:#ea6c00; --orangebg:#fff7ed; --orangeb:#fed7aa;
    --red:#dc2626; --redbg:#fef2f2; --redb:#fecaca;
    --teal:#0891b2; --tealbg:#ecfeff; --tealb:#a5f3fc;
    --amber:#d97706; --amberbg:#fffbeb;
    --purple:#7c3aed; --purplebg:#f5f3ff;
    --radius:10px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}
  .app-header{background:var(--bg2);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
  .app-header h1{font-size:16px;font-weight:700;}
  .app-header .sub{font-size:11px;color:var(--textm);}
  .container{max-width:960px;margin:0 auto;padding:24px 20px 80px;}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
  .card-header{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .card-header-left{display:flex;align-items:center;gap:8px;}
  .card-header-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--textm);font-family:'Courier New',monospace;}
  .card-body{padding:16px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-grid.three{grid-template-columns:1fr 1fr 1fr;}
  .form-group{display:flex;flex-direction:column;gap:5px;}
  label{font-size:11px;color:var(--textm);font-weight:600;letter-spacing:.04em;}
  input[type=text],input[type=date],input[type=number],select,textarea{
    background:var(--bg3);border:1px solid var(--line);border-radius:7px;
    color:var(--text);font-size:13px;padding:8px 11px;outline:none;
    transition:border-color .15s;width:100%;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--blue);}
  textarea{resize:vertical;min-height:56px;}
  select option{background:var(--bg3);}
  .order-search-wrap{position:relative;}
  .order-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:200;background:var(--bg3);border:1px solid var(--line);border-radius:8px;max-height:220px;overflow-y:auto;display:none;}
  .order-dropdown.show{display:block;}
  .order-option{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line);transition:background .1s;}
  .order-option:last-child{border-bottom:none;}
  .order-option:hover{background:var(--bg4);}
  .order-option-name{font-size:13px;font-weight:600;}
  .order-option-sub{font-size:11px;color:var(--textm);margin-top:2px;}
  .js-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .js-tab{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid var(--line);background:var(--bg3);color:var(--textm);transition:all .15s;display:flex;align-items:center;gap:6px;}
  .js-tab.active{border-color:var(--blue);background:var(--bluebg);color:var(--blue);}
  .js-tab .tab-del{color:var(--red);font-size:14px;line-height:1;padding:0 2px;}
  .btn-add-js{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:2px dashed var(--line);background:transparent;color:var(--textm);transition:all .15s;}
  .btn-add-js:hover{border-color:var(--green);color:var(--green);}
  .size-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .size-cell{display:flex;flex-direction:column;gap:4px;align-items:center;}
  .size-cell-label{font-size:11px;font-weight:700;color:var(--textd);}
  .size-cell input{text-align:center;padding:7px 4px;font-size:14px;font-weight:700;}
  .total-display{font-size:13px;font-weight:700;color:var(--text);padding:8px 0 0;}
  .nama-table-wrap{overflow-x:auto;}
  .nama-table{width:100%;border-collapse:collapse;font-size:13px;}
  .nama-table th{font-size:10px;color:var(--textm);font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
  .nama-table td{padding:4px 4px;vertical-align:middle;}
  .nama-table input,.nama-table select{padding:7px 8px;font-size:13px;}
  .btn-del-row{background:var(--redbg);border:1px solid var(--red);color:var(--red);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .btn-del-row:hover{background:var(--red);color:#fff;}
  .btn-add-row{padding:7px 14px;background:var(--bg3);border:1px dashed var(--line);color:var(--textm);border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;margin-top:8px;}
  .btn-add-row:hover{border-color:var(--green);color:var(--green);}
  .ada-nama-toggle{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:all .15s;user-select:none;}
  .ada-nama-toggle.active{border-color:var(--green);background:var(--greenbg);}
  .toggle-dot{width:36px;height:20px;background:var(--bg4);border-radius:10px;position:relative;transition:background .2s;flex-shrink:0;}
  .ada-nama-toggle.active .toggle-dot{background:var(--green);}
  .toggle-dot::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;background:#fff;border-radius:50%;transition:left .2s;}
  .ada-nama-toggle.active .toggle-dot::after{left:19px;}
  .upload-zone{border:2px dashed var(--line);border-radius:9px;padding:20px;text-align:center;cursor:pointer;transition:all .15s;}
  .upload-zone:hover{border-color:var(--blue);background:var(--bluebg);}
  .mockup-preview{max-width:180px;max-height:140px;border-radius:8px;border:1px solid var(--line);object-fit:contain;display:block;margin:0 auto;}
  .cb-group{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:6px 0;}
  .cb-item{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:600;}
  .cb-item input{width:15px;height:15px;accent-color:var(--blue);cursor:pointer;}
  .btn{padding:10px 20px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:7px;}
  .btn-secondary{background:var(--bg3);border:1px solid var(--line);color:var(--textd);}
  .btn-secondary:hover{background:var(--bg4);}
  .btn-green{background:var(--green);color:#000;}
  .btn-green:hover{opacity:.85;}
  .kilang-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .kilang-card{background:var(--bg3);border:2px solid var(--line);border-radius:9px;padding:14px 12px;cursor:pointer;text-align:center;transition:all .15s;}
  .kilang-card:hover,.kilang-card.selected{border-color:var(--blue);background:var(--bluebg);}
  .kilang-card-icon{font-size:22px;margin-bottom:5px;}
  .kilang-card-name{font-size:13px;font-weight:700;}
  .kilang-card-sub{font-size:10px;color:var(--textm);margin-top:2px;}
  .action-bar{display:flex;gap:10px;justify-content:flex-end;padding-top:12px;border-top:1px solid var(--line);margin-top:4px;}
  .toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--bg3);border:1px solid var(--line);color:var(--text);padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:fadeIn .2s ease;}
  .toast.error{border-color:var(--red);color:var(--red);}
  .toast.success{border-color:var(--green);color:var(--green);}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @media(max-width:600px){.form-grid{grid-template-columns:1fr;}.size-grid{grid-template-columns:repeat(3,1fr);}}
</style>
</head>
<body>
<div class="app-header">
  <span style="font-size:20px;">🏭</span>
  <div><h1>Jobsheet Generator</h1><span class="sub">Jana jobsheet untuk dihantar ke kilang</span></div>
</div>
<div class="container">

  <!-- KILANG -->
  <div class="card">
    <div class="card-header"><div class="card-header-left"><span style="font-size:15px;">🏭</span><span class="card-header-title">1. Pilih Kilang</span></div></div>
    <div class="card-body">
      <div class="kilang-grid" id="kilangGrid">
        <!-- Populated by buildKilangGrid() -->
      </div>
    </div>
  </div>

  <!-- MAKLUMAT ORDER -->
  <div class="card">
    <div class="card-header"><div class="card-header-left"><span style="font-size:15px;">📋</span><span class="card-header-title">2. Maklumat Order</span></div></div>
    <div class="card-body">
      <div class="form-grid" style="margin-bottom:12px;">
        <div class="form-group">
          <label>Cari Order (Optional)</label>
          <div class="order-search-wrap">
            <input type="text" id="orderSearch" placeholder="Taip nama job..." autocomplete="off"
              oninput="searchOrders(this.value)" onfocus="searchOrders(this.value)" onblur="setTimeout(closeDropdown,200)">
            <div class="order-dropdown" id="orderDropdown"></div>
          </div>
        </div>
        <div class="form-group">
          <label>Tarikh Order</label>
          <input type="date" id="fOrderDate">
        </div>
        <div class="form-group">
          <label>Nama Job (untuk kilang) *</label>
          <input type="text" id="fJobName" placeholder="cth: SK DAMAK">
        </div>
        <div class="form-group">
          <label>Customer (untuk kilang)</label>
          <input type="text" id="fCustName" placeholder="Nama untuk kilang sahaja">
        </div>
        <div class="form-group">
          <label>Material / Kain *</label>
          <input type="text" id="fKainType" placeholder="cth: Eyelet, Microfiber, Cotton">
        </div>
        <div class="form-group">
          <label>Neck</label>
          <div class="cb-group">
            <label class="cb-item"><input type="checkbox" id="cbReady"> Ready</label>
            <label class="cb-item"><input type="checkbox" id="cbSubli"> Sublimation</label>
          </div>
        </div>
        <div class="form-group">
          <label>Printer No.</label>
          <div class="cb-group">
            <label class="cb-item"><input type="checkbox" id="cbP1"> 1</label>
            <label class="cb-item"><input type="checkbox" id="cbP2"> 2</label>
            <label class="cb-item"><input type="checkbox" id="cbP3"> 3</label>
            <label class="cb-item"><input type="checkbox" id="cbP4"> 4</label>
          </div>
        </div>
        <div class="form-group">
          <label>Collect On</label>
          <input type="date" id="fCollectDate">
        </div>
        <div class="form-group">
          <label>Remark</label>
          <textarea id="fRemark" placeholder="Nota tambahan..."></textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- JOBSHEET TABS -->
  <div class="card">
    <div class="card-header">
      <div class="card-header-left"><span style="font-size:15px;">📄</span><span class="card-header-title">3. Senarai Jobsheet</span></div>
      <button class="btn-add-js" onclick="addJobsheet()">＋ Tambah Jobsheet</button>
    </div>
    <div class="card-body" style="padding-top:12px;">
      <div class="js-tabs" id="jsTabs"></div>
      <div id="jsContent"></div>
    </div>
  </div>

  <div class="action-bar">
    <button class="btn btn-secondary" onclick="resetAll()">🔄 Reset Semua</button>
    <button class="btn btn-secondary" onclick="saveAndSync()" style="background:var(--bg3);border:1px solid var(--teal);color:var(--teal);">💾 Simpan & Sync ke Order</button>
    <button class="btn btn-green" onclick="generateAll()">🖨️ Jana & Print Semua Jobsheet</button>
  </div>
</div>

let selectedKilang='general';
let selectedKilangName='';
let allSuppliers=[];
let allOrders=[];
let jobsheets=[];
let activeJsIdx=0;
let jsCounter=0;

document.addEventListener('DOMContentLoaded',()=>{
  setDefaultDate();
  loadOrders();
  loadSuppliers();
  addJobsheet();
  checkViewMode();
  checkEditMode();
  autoFillFromParams();
});

function autoFillFromParams() {
  const p = new URLSearchParams(window.location.search);
  if (p.get('view')) return;
  const jobName    = p.get('job_name');
  const kainType   = p.get('kain_type');
  const orderId    = p.get('order_id');
  const orderDate  = p.get('order_date');
  const collectDate= p.get('collect_date');
  if (jobName)     document.getElementById('fJobName').value    = jobName;
  if (kainType)    document.getElementById('fKainType').value   = kainType;
  if (orderDate)   document.getElementById('fOrderDate').value  = orderDate;
  if (collectDate) document.getElementById('fCollectDate').value= collectDate;
  if (jobName)     document.getElementById('orderSearch').value = jobName;
  if (orderId) {
    // Fetch order directly from Supabase
    fetch(`${SUPA_URL}/rest/v1/orders?select=id,name_job,kain_type,product_type,date_submit_kilang,production_date&id=eq.${encodeURIComponent(orderId)}&limit=1`,
      {headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}})
    .then(r=>r.json()).then(rows=>{
      if(!Array.isArray(rows)||!rows.length) return;
      const m=rows[0];
      if(!jobName && m.name_job){
        document.getElementById('fJobName').value=m.name_job;
        document.getElementById('orderSearch').value=m.name_job;
      }
      if(!kainType && m.kain_type) document.getElementById('fKainType').value=m.kain_type;
      if(!orderDate && m.date_submit_kilang) document.getElementById('fOrderDate').value=m.date_submit_kilang;
      if(!collectDate && m.production_date) document.getElementById('fCollectDate').value=m.production_date;
      const js=jobsheets[activeJsIdx];
      if(js && m.product_type){js.productType=m.product_type;renderActiveJobsheet();}
    }).catch(e=>console.warn('autoFill fetch failed',e));
  }
}

function setDefaultDate(){
  const d=new Date();
  document.getElementById('fOrderDate').value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function loadOrders(){
  try{
    const res=await fetch(`${SUPA_URL}/rest/v1/orders?select=id,name_job,inv_number,order_date,pcs,sizes,product_type,kain_type,ada_nama,cust_name,date_submit_kilang,production_date&is_deleted=not.is.true&order=order_date.desc&limit=300`,
      {headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}});
    const data=await res.json();
    allOrders=Array.isArray(data)?data:[];
  }catch(e){allOrders=[];console.warn('loadOrders failed',e);}
}

async function loadSuppliers(){
  try{
    const res=await fetch(`${SUPA_URL}/rest/v1/suppliers?select=id,name,short&order=name.asc`,
      {headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}});
    const rows=await res.json();
    allSuppliers=Array.isArray(rows)?rows:[];
  }catch(e){
    // fallback: use cached if any
    allSuppliers=[];
    console.warn('loadSuppliers failed',e);
  }
  buildKilangGrid();
}

function buildKilangGrid(){
  const grid=document.getElementById('kilangGrid');
  if(!grid)return;
  if(!allSuppliers.length){
    grid.innerHTML=`<div style="font-size:12px;color:var(--textm);padding:8px;">Tiada kilang dalam Supplier Directory. Tambah kilang dalam Masterlist → Supplier dahulu.</div>`;
    return;
  }
  grid.innerHTML=allSuppliers.map((s,i)=>{
    const isFirst=i===0;
    if(isFirst){selectedKilang=s.id;selectedKilangName=s.name;}
    return `<div class="kilang-card ${isFirst?'selected':''}" onclick="selectKilang('${esc(s.id)}','${esc(s.name)}',this)" data-id="${esc(s.id)}">
      <div class="kilang-card-icon">🏭</div>
      <div class="kilang-card-name">${esc(s.short||s.name)}</div>
    </div>`;
  }).join('');
}

function selectKilang(id,name,el){
  selectedKilang=id;
  selectedKilangName=name;
  document.querySelectorAll('.kilang-card').forEach(c=>c.classList.remove('selected'));
  if(el)el.classList.add('selected');
}

function searchOrders(q){
  const dd=document.getElementById('orderDropdown');
  if(!q){dd.classList.remove('show');return;}
  const matches=allOrders.filter(o=>(o.name_job||'').toLowerCase().includes(q.toLowerCase())||(o.inv_number||'').toLowerCase().includes(q.toLowerCase())).slice(0,10);
  if(!matches.length){dd.classList.remove('show');return;}
  dd.innerHTML=matches.map((o,i)=>`<div class="order-option" onmousedown="selectOrder(${allOrders.indexOf(o)})"><div class="order-option-name">${esc(o.name_job||'—')}</div><div class="order-option-sub">${o.inv_number||''} · ${o.order_date||''} · ${o.pcs||0} pcs</div></div>`).join('');
  dd.classList.add('show');
}
function closeDropdown(){document.getElementById('orderDropdown').classList.remove('show');}
function selectOrder(i){
  const o=allOrders[i];
  document.getElementById('orderSearch').value=o.name_job||'';
  closeDropdown();
  document.getElementById('fJobName').value=o.name_job||'';
  if(o.kain_type)document.getElementById('fKainType').value=o.kain_type;
  if(o.order_date)document.getElementById('fOrderDate').value=o.order_date;
  const js=jobsheets[activeJsIdx];
  if(!js)return;
  if(o.product_type){const el=document.getElementById(`js_${js.id}_productType`);if(el)el.value=o.product_type;}
  if(o.ada_nama){js.adaNama=true;refreshAdaNamaUI(js);}
  if(o.sizes&&!js.adaNama)parseSizesIntoGrid(js.id,o.sizes);
}

// ── JOBSHEET MANAGEMENT ──
function addJobsheet(){
  const id=++jsCounter;
  jobsheets.push({id,label:`Jobsheet ${jobsheets.length+1}`,customLabel:false,productType:'',collarType:'',collarColour:'',sleeveType:'SHORT SLEEVE',adaNama:false,urgent:false,sizeQtys:{},extSizes:[],namaRows:[],mockupDataUrl:null,remark:''});
  renderTabs();
  setActiveTab(jobsheets.length-1);
}
function removeJobsheet(idx){
  if(jobsheets.length<=1){showToast('Mesti ada sekurang-kurangnya 1 jobsheet','error');return;}
  jobsheets.splice(idx,1);
  jobsheets.forEach((js,i)=>{if(!js.customLabel)js.label=`Jobsheet ${i+1}`;});
  renderTabs();
  setActiveTab(Math.min(idx,jobsheets.length-1));
}
function setActiveTab(idx){activeJsIdx=idx;renderTabs();renderActiveJobsheet();}
function renderTabs(){
  document.getElementById('jsTabs').innerHTML=jobsheets.map((js,i)=>`
    <div class="js-tab ${i===activeJsIdx?'active':''}" onclick="setActiveTab(${i})">
      <span>${esc(js.label)}</span>
      ${jobsheets.length>1?`<span class="tab-del" onclick="event.stopPropagation();removeJobsheet(${i})">✕</span>`:''}
    </div>`).join('');
}

const KIDS_SIZES_FORM=['22','24','26','28','30','32','34','36','38'];

function renderSizeGrid(js){
  if(!js.extSizes)js.extSizes=[];
  const extCells=js.extSizes.map(s=>`<div class="size-cell" style="border-color:var(--blue);"><div class="size-cell-label">${s} <span onclick="removeExtSize(${js.id},'${s}')" style="color:#d33;cursor:pointer;font-weight:700;" title="Buang saiz">✕</span></div><input type="number" min="0" id="js_${js.id}_sz_${s}" value="${js.sizeQtys[s]||''}" placeholder="0" oninput="saveSizeQty(${js.id},'${s}',this.value)"></div>`).join('');
  const remainingExt=EXTENDED_SIZES.filter(s=>!js.extSizes.includes(s));
  const extAdder=remainingExt.length?`<div style="display:flex;gap:6px;align-items:center;margin-top:8px;">
      <select id="js_${js.id}_extSelect" style="width:auto;padding:6px 8px;font-size:12px;">
        <option value="">+ Saiz Extended…</option>
        ${remainingExt.map(s=>`<option value="${s}">${s}</option>`).join('')}
      </select>
      <button class="btn-add-row" style="margin-top:0;" onclick="addExtSize(${js.id})">＋ Tambah</button>
    </div>`:'';
  return `<div>
    <label style="display:block;margin-bottom:6px;">Pecahan Saiz — Adult</label>
    <div class="size-grid">
      ${SIZES.map(s=>`<div class="size-cell"><div class="size-cell-label">${s}</div><input type="number" min="0" id="js_${js.id}_sz_${s}" value="${js.sizeQtys[s]||''}" placeholder="0" oninput="saveSizeQty(${js.id},'${s}',this.value)"></div>`).join('')}
      ${extCells}
    </div>
    ${extAdder}
    <label style="display:block;margin-top:10px;margin-bottom:6px;">Pecahan Saiz — Kids</label>
    <div class="size-grid">
      ${KIDS_SIZES_FORM.map(s=>`<div class="size-cell"><div class="size-cell-label">${s}</div><input type="number" min="0" id="js_${js.id}_sz_${s}" value="${js.sizeQtys[s]||''}" placeholder="0" oninput="saveSizeQty(${js.id},'${s}',this.value)"></div>`).join('')}
    </div>
    <div class="total-display">Total: <span id="js_${js.id}_total" style="color:var(--blue);">${calcJsTotal(js)} PCS</span></div>
  </div>`;
}

function renderNamaTable(js){
  return `<div class="nama-table-wrap">
    <table class="nama-table">
      <thead><tr><th>NAMA</th><th>NO.</th><th>SAIZ</th><th>QTY</th><th></th></tr></thead>
      <tbody id="js_${js.id}_namaBody">
        ${js.namaRows.map((r,i)=>renderNamaRow(js.id,i,r)).join('')}
      </tbody>
    </table>
    <div style="display:flex;gap:6px;margin-top:8px;">
      <button class="btn-add-row" style="margin-top:0;" onclick="addNamaRows(${js.id},1)">＋ 1 Baris</button>
      <button class="btn-add-row" style="margin-top:0;" onclick="addNamaRows(${js.id},5)">＋ 5 Baris</button>
      <button class="btn-add-row" style="margin-top:0;" onclick="addNamaRows(${js.id},10)">＋ 10 Baris</button>
    </div>
    <div class="total-display">Total: <span style="color:var(--blue);">${calcJsTotal(js)} PCS</span></div>
  </div>`;
}

function renderNamaRow(jsId,rowIdx,r){
  return `<tr id="js_${jsId}_namaRow_${rowIdx}">
    <td><input type="text" value="${esc(r.nama||'')}" placeholder="Nama" oninput="saveNamaField(${jsId},${rowIdx},'nama',this.value)"></td>
    <td><input type="text" value="${esc(r.nombor||'')}" placeholder="No." style="width:70px;" oninput="saveNamaField(${jsId},${rowIdx},'nombor',this.value)"></td>
    <td><select onchange="saveNamaField(${jsId},${rowIdx},'saiz',this.value)" style="width:90px;"><option value="">—</option>${[...SIZES,...EXTENDED_SIZES,...KIDS_SIZES_FORM].map(s=>`<option value="${s}" ${r.saiz===s?'selected':''}>${s}</option>`).join('')}</select></td>
    <td><input type="number" min="1" value="${r.qty||1}" style="width:60px;text-align:center;" oninput="saveNamaField(${jsId},${rowIdx},'qty',this.value)"></td>
    <td><button class="btn-del-row" onclick="delNamaRow(${jsId},${rowIdx})">✕</button></td>
  </tr>`;
}

// ── STATE ──
function getJs(id){return jobsheets.find(j=>j.id===id);}
function updateJsLabel(id,val){const js=getJs(id);if(!js)return;js.label=val||`Jobsheet ${jobsheets.indexOf(js)+1}`;js.customLabel=!!val;renderTabs();}
function saveJsField(id,field,val){const js=getJs(id);if(js)js[field]=val;}
function saveSizeQty(id,size,val){
  const js=getJs(id);if(!js)return;
  js.sizeQtys[size]=parseInt(val)||0;
  const el=document.getElementById(`js_${id}_total`);if(el)el.textContent=calcJsTotal(js)+' PCS';
}
function calcJsTotal(js){
  if(js.adaNama)return js.namaRows.reduce((s,r)=>s+(parseInt(r.qty)||1),0);
  const allSizes=[...SIZES,...EXTENDED_SIZES,...KIDS_SIZES_FORM];
  return allSizes.reduce((s,sz)=>s+(parseInt(js.sizeQtys[sz])||0),0);
}
function addExtSize(id){
  const js=getJs(id);if(!js)return;
  const sel=document.getElementById(`js_${id}_extSelect`);
  if(!sel||!sel.value)return;
  if(!js.extSizes)js.extSizes=[];
  if(!js.extSizes.includes(sel.value))js.extSizes.push(sel.value);
  js.extSizes.sort((a,b)=>EXTENDED_SIZES.indexOf(a)-EXTENDED_SIZES.indexOf(b));
  refreshSizeSection(js);
}
function removeExtSize(id,s){
  const js=getJs(id);if(!js)return;
  js.extSizes=(js.extSizes||[]).filter(x=>x!==s);
  delete js.sizeQtys[s];
  refreshSizeSection(js);
}
function refreshSizeSection(js){
  const el=document.getElementById(`js_${js.id}_sizeSection`);
  if(el)el.innerHTML=js.adaNama?renderNamaTable(js):renderSizeGrid(js);
}
window.addExtSize=addExtSize;
window.removeExtSize=removeExtSize;
function toggleAdaNama(id){const js=getJs(id);if(!js)return;js.adaNama=!js.adaNama;refreshAdaNamaUI(js);}
function toggleUrgent(id){const js=getJs(id);if(!js)return;js.urgent=!js.urgent;renderActiveJobsheet();}
window.toggleUrgent=toggleUrgent;
function refreshAdaNamaUI(js){
  const t=document.getElementById(`js_${js.id}_toggle`);
  if(t){t.className=`ada-nama-toggle ${js.adaNama?'active':''}`;t.querySelector('span').textContent=js.adaNama?'Ada Nama':'Tiada Nama';}
  const s=document.getElementById(`js_${js.id}_sizeSection`);
  if(s)s.innerHTML=js.adaNama?renderNamaTable(js):renderSizeGrid(js);
}
function addNamaRow(id){ addNamaRows(id,1); }

function addNamaRows(id, count){
  const js=getJs(id);if(!js)return;
  const tbody=document.getElementById(`js_${id}_namaBody`);
  for(let n=0;n<count;n++){
    js.namaRows.push({nama:'',nombor:'',saiz:'',qty:''});
    if(tbody){
      const i=js.namaRows.length-1;
      const tr=document.createElement('tr');
      tr.id=`js_${id}_namaRow_${i}`;
      tr.innerHTML=renderNamaRow(id,i,js.namaRows[i]).replace(/^<tr[^>]*>/,'').replace(/<\/tr>$/,'');
      tbody.appendChild(tr);
    }
  }
  updateNamaTotal(js);
  if(tbody) tbody.lastElementChild?.querySelector('input')?.focus();
}
window.addNamaRows=addNamaRows;
function delNamaRow(id,rowIdx){
  const js=getJs(id);if(!js)return;
  js.namaRows.splice(rowIdx,1);
  const s=document.getElementById(`js_${id}_sizeSection`);if(s)s.innerHTML=renderNamaTable(js);
}
function saveNamaField(id,rowIdx,field,val){
  const js=getJs(id);if(!js||!js.namaRows[rowIdx])return;
  js.namaRows[rowIdx][field]=field==='qty'?(parseInt(val)||1):val;
  updateNamaTotal(js);
}
function updateNamaTotal(js){
  const s=document.getElementById(`js_${js.id}_sizeSection`);if(!s)return;
  const el=s.querySelector('.total-display span');if(el)el.textContent=calcJsTotal(js)+' PCS';
}
function handleMockup(id,input){
  const file=input.files[0];if(!file)return;
  if(file.size>5*1024*1024){showToast('Fail terlalu besar (max 5MB)','error');return;}
  const js=getJs(id);if(!js)return;
  const reader=new FileReader();
  reader.onload=e=>{js.mockupDataUrl=e.target.result;renderActiveJobsheet();};
  reader.readAsDataURL(file);
}
function clearMockup(id){const js=getJs(id);if(!js)return;js.mockupDataUrl=null;renderActiveJobsheet();}
function parseSizesIntoGrid(id,str){
  const js=getJs(id);if(!js||js.adaNama)return;
  js.sizeQtys={};
  js.extSizes=[];
  str.split(/[,;]+/).map(p=>p.trim()).filter(Boolean).forEach(p=>{
    const m=p.match(/^([A-Za-z0-9]+)\s*[×x\-:]\s*(\d+)$/i);
    if(m){
      const sz=m[1].toUpperCase();
      js.sizeQtys[sz]=parseInt(m[2]);
      if(EXTENDED_SIZES.includes(sz)&&!js.extSizes.includes(sz))js.extSizes.push(sz);
    }
  });
  js.extSizes.sort((a,b)=>EXTENDED_SIZES.indexOf(a)-EXTENDED_SIZES.indexOf(b));
  renderActiveJobsheet();
}

// ── GENERATE ──
function generateAll(){
  const jobName=document.getElementById('fJobName').value.trim();
  const custName=document.getElementById('fCustName').value.trim();
  const kainType=document.getElementById('fKainType').value.trim();
  const orderDate=document.getElementById('fOrderDate').value;
  const collectDate=document.getElementById('fCollectDate').value;
  const remark=document.getElementById('fRemark').value.trim();
  const neckReady=document.getElementById('cbReady').checked;
  const neckSubli=document.getElementById('cbSubli').checked;
  const printers=[1,2,3,4].filter(n=>document.getElementById(`cbP${n}`).checked);

  if(!jobName){showToast('Sila isi Nama Job','error');document.getElementById('fJobName').focus();return;}
  if(!kainType){showToast('Sila isi Material / Kain','error');document.getElementById('fKainType').focus();return;}

  const shared={jobName,custName:custName||'—',kainType,orderDateFmt:fmtDate(orderDate),collectDateFmt:fmtDate(collectDate),orderDate,collectDate,neckReady,neckSubli,printers};
  const pages=jobsheets.map(js=>buildGeneralPage(js,shared));
  const win=window.open('','_blank');
  if(!win){showToast('Popup disekat. Benarkan popup browser.','error');return;}
  win.document.write(buildPrintDoc(jobName,pages));
  win.document.close();
}

function buildGeneralPage(js,shared){
  const ADULT_SIZES=['XS','S','M','L','XL','2XL','3XL','4XL','5XL','6XL','7XL','8XL'];
  const KIDS_SIZES=['22','24','26','28','30','32','34','36','38'];
  const ALL_ADULT=[...ADULT_SIZES,...EXTENDED_SIZES];

  // Build size qty map
  const sizeQtyMap={};
  [...ALL_ADULT,...KIDS_SIZES].forEach(s=>{
    sizeQtyMap[s]=js.adaNama
      ?js.namaRows.filter(r=>r.saiz===s).reduce((sum,r)=>sum+(parseInt(r.qty)||1),0)
      :(js.sizeQtys[s]||0);
  });

  // Total = adult + kids combined
  const totalPcs=[...ALL_ADULT,...KIDS_SIZES].reduce((sum,s)=>sum+(sizeQtyMap[s]||0),0);

  // Dynamic columns — hanya saiz dengan qty > 0; fallback grid penuh jika kosong
  let activeAdult=ALL_ADULT.filter(s=>sizeQtyMap[s]>0);
  let activeKids=KIDS_SIZES.filter(s=>sizeQtyMap[s]>0);
  if(!activeAdult.length&&!activeKids.length){activeAdult=ADULT_SIZES;activeKids=KIDS_SIZES;}
  const showKids=activeKids.length>0;
  const colCount=Math.max(activeAdult.length,showKids?activeKids.length:0);
  const padA=colCount-activeAdult.length;
  const padK=showKids?colCount-activeKids.length:0;

  // Adult size row
  const adultSizeRow=activeAdult.map(s=>{
    const qty=sizeQtyMap[s];
    return `<td style="border:1px solid #000;padding:5px 2px;text-align:center;font-size:10px;font-weight:${qty>0?'700':'400'};color:${qty>0?'#000':'#ccc'};">${qty||''}</td>`;
  }).join('');

  // Kids size row
  const kidsSizeRow=activeKids.map(s=>{
    const qty=sizeQtyMap[s];
    return `<td style="border:1px solid #000;padding:5px 2px;text-align:center;font-size:10px;font-weight:${qty>0?'700':'400'};color:${qty>0?'#000':'#ccc'};">${qty||''}</td>`;
  }).join('');

  // URGENT detection
  let isUrgent = js.urgent || false;
  if (!isUrgent && shared.orderDate && shared.collectDate) {
    const d1 = new Date(shared.orderDate+'T00:00:00');
    const d2 = new Date(shared.collectDate+'T00:00:00');
    const diff = Math.round((d2-d1)/(1000*60*60*24));
    if (!isNaN(diff) && diff <= 3) isUrgent = true;
  }

  const urgentStamp = isUrgent
    ? `<div style="border:3px solid #cc0000;border-radius:6px;padding:3px 12px;transform:rotate(-6deg);display:inline-block;margin-left:16px;">
        <div style="font-size:20px;font-weight:900;color:#cc0000;letter-spacing:3px;font-family:Arial Black,sans-serif;">URGENT</div>
       </div>`
    : '';

  const neckBoxes=`<span style="margin-right:12px;">${shared.neckReady?'☑':'☐'} Ready</span><span>${shared.neckSubli?'☑':'☐'} Sublimation</span>`;
  const printerChecked=[1,2,3,4].map(n=>`<span style="margin-right:10px;">${shared.printers.includes(n)?'☑':'☐'} ${n}</span>`).join('');

  const mockupHtml=js.mockupDataUrl
    ?`<img src="${js.mockupDataUrl}" style="width:100%;height:100%;object-fit:contain;display:block;">`
    :`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#ccc;font-size:12px;gap:8px;"><div style="font-size:32px;opacity:.4;">⬜</div><span>MOCKUP</span></div>`;

  // Nama table row builder helper
  const buildNamaRow=(r,i)=>{
    const bg=i%2===0?'#fff':'#fafafa';
    const hasFill=!!(r.nama||r.nombor);
    return `<tr style="background:${bg};">
      <td style="border:1px solid #000;padding:2px 4px;font-size:9px;height:14px;font-weight:${hasFill?'700':'400'};">${h(r.nama||'')}</td>
      <td style="border:1px solid #000;padding:2px 4px;font-size:9px;text-align:center;font-weight:${hasFill?'700':'400'};">${h(r.nombor||'')}</td>
      <td style="border:1px solid #000;padding:2px 4px;font-size:9px;text-align:center;font-weight:${hasFill?'700':'400'};">${hasFill?h(r.saiz||''):''}</td>
      <td style="border:1px solid #000;padding:2px 4px;font-size:9px;text-align:center;font-weight:${hasFill?'700':'400'};">${hasFill?(r.qty||''):''}</td>
    </tr>`;
  };

  // Nama rows — min 20, unlimited if more
  const NAMA_MIN=20;
  const filledRows=js.adaNama?js.namaRows:[];
  const totalRows=Math.max(NAMA_MIN, filledRows.length);
  const namaRows=Array.from({length:totalRows},(_,i)=>{
    const r=filledRows[i]||{nama:'',nombor:'',saiz:'',qty:''};
    return buildNamaRow(r,i);
  }).join('');

  const VAL='font-weight:700;';
  const RED='font-weight:700;color:#cc0000;';

  // Logo+urgent header row — inside thead so it repeats on page break
  const logoHeaderRow=`<tr style="background:#fff;">
    <td colspan="4" style="padding:8px 0 6px;text-align:center;border:none;">
      <div style="display:flex;align-items:center;justify-content:center;gap:12px;">
        <img src="${DOD_LOGO}" style="height:44px;object-fit:contain;">
        ${urgentStamp}
      </div>
      <div style="border-top:2px solid #000;margin-top:6px;"></div>
    </td>
  </tr>`;

  return `<div class="page">

  <!-- ══ PAGE HEADER: logo wraps into every page via outer thead ══ -->
  <table style="width:100%;border-collapse:collapse;">
    <thead>
      <tr><td colspan="1" style="padding:0;border:none;">
        <div style="display:flex;align-items:center;justify-content:center;margin-bottom:8px;min-height:60px;">
          <img src="${DOD_LOGO}" style="height:52px;object-fit:contain;">
          ${urgentStamp}
        </div>
        <div style="border-top:2px solid #000;margin-bottom:8px;"></div>
      </td></tr>
    </thead>
    <tbody><tr><td style="padding:0;border:none;">

  <!-- ══ HEADER INFO ══ -->
  <table style="width:100%;border-collapse:collapse;margin-bottom:8px;">
    <tr>
      <td style="width:52%;vertical-align:top;padding-right:14px;">
        <table style="width:100%;font-size:11px;line-height:1.6;">

function buildSizeSection(js){
  const sizes=[...SIZES,...EXTENDED_SIZES,...KIDS_SIZES_FORM].filter(s=>(js.sizeQtys[s]||0)>0);
  if(!sizes.length)return`<p style="text-align:center;color:#999;font-size:13px;margin:12px 0;">— Tiada data saiz —</p>`;
  return`<table style="margin:0 auto 4px;border-collapse:collapse;">${sizes.map(s=>`<tr><td style="padding:5px 20px;font-size:15px;font-weight:700;text-align:center;">${s}</td><td style="padding:5px 20px;font-size:15px;font-weight:700;text-align:center;">${js.sizeQtys[s]}</td></tr>`).join('')}</table>`;
}

function buildNamaSection(js){
  if(!js.namaRows.length)return`<p style="text-align:center;color:#999;font-size:13px;margin:12px 0;">— Tiada data nama —</p>`;
  const groups={};
  js.namaRows.forEach(r=>{const s=r.saiz||'S';if(!groups[s])groups[s]=[];groups[s].push(r);});
  const orderedSizes=[...SIZES,...EXTENDED_SIZES,...KIDS_SIZES_FORM].filter(s=>groups[s]);
  let html=`<table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:4px;">
    <thead><tr style="border-bottom:2px solid #000;">
      <th style="padding:5px 8px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;width:35%;">NAMA</th>
      <th style="padding:5px 8px;text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.06em;width:12%;">NO.</th>
      <th style="padding:5px 8px;text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.06em;width:12%;">SAIZ</th>
      <th style="padding:5px 8px;text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.06em;width:12%;">QTY</th>
      <th style="padding:5px 8px;text-align:right;font-size:10px;text-transform:uppercase;letter-spacing:.06em;width:29%;color:#c03000;">TOTAL SAIZ</th>
    </tr></thead><tbody>`;
  orderedSizes.forEach((s,gi)=>{
    const rows=groups[s];
    const sizeTotal=rows.reduce((sum,r)=>sum+(parseInt(r.qty)||1),0);
    rows.forEach((r,ri)=>{
      const bg=gi%2===0?'#fff':'#f8f8f8';
      const isLast=ri===rows.length-1;
      html+=`<tr style="background:${bg};${isLast?'border-bottom:1.5px solid #ccc;':''}">
        <td style="padding:4px 8px;font-weight:600;">${h(r.nama||'—')}</td>
        <td style="padding:4px 8px;text-align:center;color:#555;">${h(r.nombor||'—')}</td>
        <td style="padding:4px 8px;text-align:center;font-weight:700;">${h(s)}</td>
        <td style="padding:4px 8px;text-align:center;">${parseInt(r.qty)||1}</td>
        ${ri===0?`<td style="padding:4px 8px;text-align:right;font-weight:900;font-size:14px;color:#c03000;vertical-align:middle;" rowspan="${rows.length}">${s} – ${sizeTotal}</td>`:''}
      </tr>`;
    });
  });
  html+=`</tbody></table>`;
  return html;
}

function fmtDate(d){if(!d)return'';try{const dt=new Date(d+'T00:00:00');return`${String(dt.getDate()).padStart(2,'0')}-${String(dt.getMonth()+1).padStart(2,'0')}-${dt.getFullYear()}`;}catch{return d;}}
function h(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function esc(s){return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

// EDIT MODE — re-populate form dari saved jobsheet
// ══════════════════════════════════════
function checkEditMode() {
  const raw = sessionStorage.getItem('dod_jobsheet_edit');
  if (!raw) return;
  sessionStorage.removeItem('dod_jobsheet_edit');
  try {
    const payload = JSON.parse(raw);
    const shared = payload.shared || payload;
    // Fill section 1+2 fields
    if (shared.jobName)     document.getElementById('fJobName').value    = shared.jobName;
    if (shared.custName && shared.custName !== '—') document.getElementById('fCustName').value = shared.custName;
    if (shared.kainType)    document.getElementById('fKainType').value   = shared.kainType;
    // Convert formatted dates back — try stored raw dates first
    const orderDateRaw   = payload.orderDate   || shared.orderDate   || '';
    const collectDateRaw = payload.collectDate || shared.collectDate || '';
    if (orderDateRaw)   document.getElementById('fOrderDate').value   = orderDateRaw;
    if (collectDateRaw) document.getElementById('fCollectDate').value = collectDateRaw;
    // Neck & printers
    if (document.getElementById('cbReady')) document.getElementById('cbReady').checked = !!shared.neckReady;
    if (document.getElementById('cbSubli')) document.getElementById('cbSubli').checked = !!shared.neckSubli;
    (shared.printers || []).forEach(n => {
      const el = document.getElementById('cbP' + n);
      if (el) el.checked = true;
    });
    // Re-populate jobsheets
    const jsArr = payload.jobsheets || [payload];
    if (jsArr.length > 0) {
      jobsheets = [];
      jsCounter = 0;
      jsArr.forEach((srcJs, i) => {
        const id = ++jsCounter;
        jobsheets.push({
          id,
          label:       srcJs.label       || `Jobsheet ${i+1}`,
          customLabel: !!srcJs.customLabel,
          productType: srcJs.productType  || '',
          collarType:  srcJs.collarType   || '',
          collarColour:srcJs.collarColour || '',
          sleeveType:  srcJs.sleeveType   || 'SHORT SLEEVE',
          adaNama:     !!srcJs.adaNama,
          urgent:      !!srcJs.urgent,
          sizeQtys:    srcJs.sizeQtys     || {},
          extSizes:    srcJs.extSizes     || Object.keys(srcJs.sizeQtys||{}).filter(s=>EXTENDED_SIZES.includes(s)),
          namaRows:    srcJs.namaRows     || [],
          mockupDataUrl: srcJs.mockupDataUrl || null,
          remark:      srcJs.remark       || '',
        });
      });
      renderTabs();
      setActiveTab(0);
    }
    // Fill orderSearch
    if (shared.jobName) document.getElementById('orderSearch').value = shared.jobName;
    showToast('✎ Data jobsheet diisi semula untuk edit', 'success');
  } catch(e) {
    console.warn('checkEditMode parse failed:', e);
  }
}

// VIEW MODE — re-render saved jobsheet
// ══════════════════════════════════════
function checkViewMode() {
  const params = new URLSearchParams(window.location.search);
  if (!params.get('view')) return;
  try {
    // Read payload from sessionStorage (set by masterlist)
    const raw = sessionStorage.getItem('dod_jobsheet_view');
    if (!raw) { showToast('Tiada data jobsheet — cuba jana semula', 'error'); return; }
    const payload = JSON.parse(raw);
    sessionStorage.removeItem('dod_jobsheet_view'); // clean up
    document.querySelector('.container').style.display = 'none';
    renderViewMode(payload);
  } catch(e) {
    console.warn('View mode parse failed:', e);
    showToast('Gagal buka jobsheet', 'error');
  }
}

function renderViewMode(payload) {
  try {
    let pages = [];
    const shared = payload.shared || {
      jobName:        payload.jobName        || '',
      custName:       payload.custName       || '—',
      kainType:       payload.kainType       || '',
      orderDateFmt:   payload.orderDateFmt   || '',
      collectDateFmt: payload.collectDateFmt || '',
      neckReady:      payload.neckReady      || false,
      neckSubli:      payload.neckSubli      || false,
      printers:       payload.printers       || [],
    };

    if (payload.jobsheets && Array.isArray(payload.jobsheets)) {
      pages = payload.jobsheets.map(js => buildGeneralPage(js, shared));
    } else {
      pages = [buildGeneralPage(payload, shared)];
    }

    const jobName = shared.jobName || 'Jobsheet';
    const printHTML = buildPrintDoc(jobName, pages);

    // Build edit button bar + inject above print content
    const editBtnBar = `<div id="viewEditBar" style="position:fixed;top:0;left:0;right:0;z-index:9999;background:#1a1a2e;padding:10px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.4);">
      <span style="color:#fff;font-size:13px;font-weight:600;">📄 View Mode — ${jobName}</span>
      <button onclick="reEditJobsheet()" style="margin-left:auto;background:#1A5CC8;color:#fff;border:none;padding:8px 18px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;">✎ Edit</button>
      <button onclick="window.print()" style="background:#0F7A48;color:#fff;border:none;padding:8px 18px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;">🖨 Print</button>
    </div><div style="margin-top:52px;">`;

    // Store payload for re-edit
    window._viewPayload = payload;

    // Inject into current page
    document.open();
    document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + jobName + '</title>' +
      printHTML.match(/<style[\s\S]*?<\/style>/)?.[0] + '</head><body>');
    document.write(editBtnBar);
    // Extract body content from printHTML
    const bodyMatch = printHTML.match(/<body[^>]*>([\s\S]*)<\/body>/i);
    document.write(bodyMatch ? bodyMatch[1] : printHTML);
    document.write('</div><script>function reEditJobsheet(){var p=window._viewPayload||' + JSON.stringify(payload) + ';sessionStorage.setItem("dod_jobsheet_edit",JSON.stringify(p));window.location.href=window.location.pathname;}<\/script>');
    document.write('</body></html>');
    document.close();
  } catch(e) {
    console.error('renderViewMode error:', e);
    document.body.innerHTML = `<div style="padding:20px;color:red;font-family:sans-serif;">
      <h3>Gagal render jobsheet</h3><pre>${e.message}</pre>
    </div>`;
  }
}

// ══════════════════════════════════════
// SIMPAN & SYNC KE ORDER
// ══════════════════════════════════════
async function saveAndSync() {
  const jobName     = document.getElementById('fJobName').value.trim();
  const custName    = document.getElementById('fCustName').value.trim();
  const kainType    = document.getElementById('fKainType').value.trim();
  const orderDate   = document.getElementById('fOrderDate').value;
  const collectDate = document.getElementById('fCollectDate').value;
  const remark      = document.getElementById('fRemark').value.trim();
  const neckReady   = document.getElementById('cbReady').checked;
  const neckSubli   = document.getElementById('cbSubli').checked;
  const printers    = [1,2,3,4].filter(n => document.getElementById(`cbP${n}`).checked);

  if (!jobName) { showToast('Sila isi Nama Job', 'error'); return; }
  if (!selectedKilang) { showToast('Sila pilih kilang', 'error'); return; }

  const orderSearch = document.getElementById('orderSearch').value.trim();
  if (!orderSearch) { showToast('Sila pilih order dari carian untuk sync', 'error'); document.getElementById('orderSearch').focus(); return; }

  // Find matching order directly from Supabase
  let order = null;
  try {
    const urlParam = document.querySelector('[data-order-id]')?.dataset?.orderId || '';
    // Try by name_job
    const q = encodeURIComponent(orderSearch);
    const res = await fetch(`${SUPA_URL}/rest/v1/orders?select=id,name_job&name_job=ilike.*${q}*&is_deleted=not.is.true&limit=5`,
      { headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY } });
    const rows = await res.json();
    if (!rows || !rows.length) { showToast('Order tidak dijumpai — pilih dari dropdown carian', 'error'); return; }
    // Prefer exact match
    order = rows.find(o => (o.name_job||'').toLowerCase() === orderSearch.toLowerCase()) || rows[0];
  } catch(e) {
    showToast('Gagal cari order: ' + e.message, 'error'); return;
  }

  const orderId = order.id;
  const shared = {
    jobName, custName: custName||'—', kainType,
    orderDateFmt: fmtDate(orderDate),
    collectDateFmt: fmtDate(collectDate),
    neckReady, neckSubli, printers,
  };

  try {
    // 1. Sync to order: dates + supplier_name + production_status
    const updates = {};
    if (collectDate)         updates.production_date     = collectDate;
    if (orderDate)           updates.date_submit_kilang  = orderDate;
    if (selectedKilangName)  updates.supplier_name       = selectedKilangName;
    // Set production_status to 'job-submit' if not already in production
    updates.production_status = 'job-submit';

    await fetch(`${SUPA_URL}/rest/v1/orders?id=eq.${encodeURIComponent(orderId)}`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY,
        'Content-Type': 'application/json', 'Prefer': 'return=minimal',
      },
      body: JSON.stringify(updates),
    });

    // 2. Save jobsheet snapshot to documents
    const docPayload = {
      type: 'jobsheet_general',
      kilang: selectedKilangName,
      order_id: orderId,
      jobsheets: jobsheets.map(j => ({...j})),
      shared,
      jobName, custName: custName||'—', kainType,
      orderDate, collectDate,
      orderDateFmt: fmtDate(orderDate),
      collectDateFmt: fmtDate(collectDate),
    };

    await fetch(`${SUPA_URL}/rest/v1/documents`, {
      method: 'POST',
      headers: {
        'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY,
        'Content-Type': 'application/json', 'Prefer': 'return=minimal',
      },
      body: JSON.stringify({
        order_id: orderId,
        doc_type: 'jobsheet_general',
        generated_by: 'Admin',
        generated_at: new Date().toISOString(),
        snapshot: docPayload,
        notes: jobName,
        is_deleted: false,
      }),
    });

    showToast(`✓ Disimpan! Order "${order.name_job}" → Kilang: ${selectedKilangName}`, 'success');
  } catch(e) {
    showToast('Gagal sync: ' + (e.message||e), 'error');
    console.error(e);
  }
}
